langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-642e8bc9bacd4bb4b1131b516d56d47d
      model-name: deepseek-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
      strict-json-schema: true
